name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - rid: win-x64
            selfContained: true
            out: SoundBridge-Windows-x64.exe
          - rid: win-arm64
            selfContained: true
            out: SoundBridge-Windows-ARM64.exe
          - rid: win-x64
            selfContained: false
            out: SoundBridge-Windows-x64-lite.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        shell: pwsh
        run: |
          $sc = '${{ matrix.selfContained }}'
          $extra = @()
          if ($sc -eq 'true') { $extra = @('-p:EnableCompressionInSingleFile=true', '-p:IncludeNativeLibrariesForSelfExtract=true') }
          dotnet publish pc -c Release -r ${{ matrix.rid }} --self-contained $sc -p:PublishSingleFile=true @extra -o out
          Move-Item out/SoundBridge.exe "out/${{ matrix.out }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: out/${{ matrix.out }}
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - working-directory: ios
        run: xcodegen generate
      - working-directory: ios
        run: |
          xcodebuild -project SoundBridge.xcodeproj -target SoundBridge -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -30
          mkdir -p Payload && cp -R build/Release-iphoneos/SoundBridge.app Payload/
          zip -qry SoundBridge-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ios/SoundBridge-iOS-unsigned.ipa
  publish:
    needs: [windows, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/release-notes.md
